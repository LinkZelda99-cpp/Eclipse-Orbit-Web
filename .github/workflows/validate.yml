name: Validate Eclipse Orbit Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check site assets
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f assets/orbit.svg
          grep -q 'styles.css' index.html
          grep -q 'app.js' index.html
